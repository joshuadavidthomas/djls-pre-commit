[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "djls-pre-commit"
version = "0.0.0"
description = "pre-commit hooks for django-language-server"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "django-language-server==6.0.3",
]

[project.urls]
Documentation = "https://djls.joshthomas.dev/pre-commit/"
Repository = "https://github.com/joshuadavidthomas/djls-pre-commit"
